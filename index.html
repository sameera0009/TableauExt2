<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lumina Sphere | Modern Tableau Donut Extension</title>
    <!-- Tableau Extension API & D3 -->
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- Premium Font: Inter + subtle SF aesthetics -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #FFFFFF;  /* clean premium white background */
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* micro grain texture for depth (barely visible) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#f0f2f8 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        /* main container for viz */
        #viz-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* modern minimalist tooltip - elevated glass on white */
        .smart-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #1a2639;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.02) inset;
            font-family: 'Inter', monospace;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.15s ease;
            letter-spacing: -0.2px;
            white-space: nowrap;
            font-weight: 500;
        }

        .smart-tooltip b {
            color: #0066CC;
            font-weight: 700;
        }

        .smart-tooltip span {
            font-weight: 500;
            color: #2c3e66;
        }

        /* modern guidance card - appears when encodings missing */
        .guidance-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 18px 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0,0,0,0.02);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 340px;
            animation: subtleFloat 2.4s infinite ease-in-out;
            transition: all 0.3s;
        }

        .guidance-card .icon {
            font-size: 44px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .guidance-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #0a1929;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .guidance-card p {
            font-size: 13px;
            color: #5a6e8a;
            font-weight: 450;
            margin-top: 4px;
        }

        .pill-hint {
            display: inline-flex;
            background: #f0f4fe;
            border-radius: 40px;
            padding: 5px 14px;
            margin-top: 12px;
            gap: 8px;
            font-size: 11px;
            font-weight: 500;
            color: #0066cc;
        }

        @keyframes subtleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* no data / zero values state */
        .empty-state-modern {
            background: #ffffffdd;
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px 28px;
            text-align: center;
            border: 1px solid #eef2fa;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.04);
        }

        /* svg and donut enhancements */
        svg {
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.02));
            transition: all 0.2s;
        }

        .arc {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            stroke-linecap: round;
        }

        .arc:hover {
            filter: drop-shadow(0 8px 16px rgba(0, 102, 204, 0.15));
            transform: scale(1.008);
            transition: transform 0.15s;
        }

        /* center text refined */
        .center-value-premium {
            fill: #0B1C33;
            text-anchor: middle;
            dominant-baseline: middle;
            font-weight: 700;
            letter-spacing: -0.02em;
            transition: all 0.2s;
        }

        .center-label-premium {
            fill: #6c7f9e;
            text-anchor: middle;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            dominant-baseline: middle;
        }

        /* subtle legend watermark */
        .insight-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 10px;
            font-weight: 500;
            color: #3f5579;
            border: 0.5px solid rgba(0,0,0,0.04);
            pointer-events: none;
            z-index: 3;
            font-family: 'Inter', monospace;
        }

        /* micro animation for donut entrance */
        @keyframes donutFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        svg g {
            animation: donutFadeIn 0.45s ease-out;
        }
    </style>
</head>
<body>
<div id="viz-container"></div>
<div id="dynamic-tooltip" class="smart-tooltip" style="opacity:0;"></div>

<script>
    (function() {
        'use strict';

        let worksheet;
        let resizeTimeout;

        // 🎨 Premium vibrant palette (refined, modern, accessible on white bg)
        const PREMIUM_COLORS = [
            "#2563EB", // vibrant blue
            "#E11D48", // rose
            "#10B981", // emerald
            "#F59E0B", // amber
            "#8B5CF6", // violet
            "#EC4899", // pink
            "#06B6D4", // cyan
            "#F97316", // orange
            "#6366F1", // indigo
            "#84CC16"  // lime
        ];

        // Helper: get aggregated data from worksheet
        async function fetchSummaryData(ws) {
            let rows = [];
            try {
                const reader = await ws.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });
                for (let i = 0; i < reader.pageCount; i++) {
                    const page = await reader.getPageAsync(i);
                    rows = rows.concat(page.data.map(r => {
                        const row = {};
                        page.columns.forEach((col, idx) => { row[col.fieldName] = r[idx]; });
                        return row;
                    }));
                }
                await reader.releaseAsync();
                return rows;
            } catch (err) {
                console.warn("summary error:", err);
                return [];
            }
        }

        // get encoding mapping from current viz spec (Angle & Color fields)
        async function getActiveEncodings(ws) {
            try {
                const spec = await ws.getVisualSpecificationAsync();
                const encodings = { angle: null, color: null, colorsMap: {} };
                if (!spec || spec.activeMarksSpecificationIndex < 0) return encodings;
                const marks = spec.marksSpecifications[spec.activeMarksSpecificationIndex];
                if (marks && marks.encodings) {
                    for (let enc of marks.encodings) {
                        if (enc.id === "angle") encodings.angle = enc.field;
                        if (enc.id === "color") encodings.color = enc.field;
                    }
                }
                // extract color palette from Tableau if available
                if (marks && marks.colorPalette && marks.colorPalette.paletteEntries) {
                    marks.colorPalette.paletteEntries.forEach(entry => {
                        encodings.colorsMap[entry.value] = entry.color;
                    });
                }
                return encodings;
            } catch (err) {
                console.warn("encodings error", err);
                return { angle: null, color: null, colorsMap: {} };
            }
        }

        // format big numbers elegantly
        function formatSmartNumber(num) {
            if (num === undefined || num === null) return "0";
            if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + "M";
            if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, '') + "K";
            return num.toLocaleString();
        }

        // escape HTML for tooltip safety
        function safeText(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // main rendering engine with enhanced animations & UX
        function renderPremiumDonut(rawData, encodings) {
            const container = d3.select("#viz-container");
            container.selectAll("svg, .guidance-card, .empty-state-modern").remove();

            // 1. Validation: angle (measure) and color (dimension) must be present
            if (!encodings.angle || !encodings.color) {
                // Show beautiful interactive guidance with animation 
                const guidance = container.append("div")
                    .attr("class", "guidance-card")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .style("z-index", "20");
                
                guidance.html(`
                    <div class="icon">✨🎯</div>
                    <h3>Drop fields to visualize</h3>
                    <p>Drag a <strong>Measure</strong> to <strong style="color:#2563EB">Angle</strong><br>
                    and a <strong>Dimension</strong> to <strong style="color:#2563EB">Color</strong> on the Marks card.</p>
                    <div class="pill-hint">
                        <span>📐 Angle = Value</span>
                        <span>🎨 Color = Category</span>
                    </div>
                `);
                return;
            }

            // 2. Process raw data: aggregate by color dimension
            const angleFieldName = encodings.angle.name;
            const colorFieldName = encodings.color.name;
            
            if (!angleFieldName || !colorFieldName) {
                container.append("div")
                    .attr("class", "empty-state-modern")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .html(`<span style="font-size:28px;">📌</span><br/><span style="font-weight:500;">Incomplete field mapping</span><br/><span style="font-size:12px;">Assign valid fields to Angle & Color</span>`);
                return;
            }

            // Build aggregated map
            const aggregatedMap = new Map();
            for (let row of rawData) {
                let rawValue = row[angleFieldName]?.nativeValue;
                let numericVal = parseFloat(rawValue);
                if (isNaN(numericVal)) numericVal = 0;
                let category = row[colorFieldName]?.formattedValue || "Undefined";
                if (category === "Undefined" || category === "" || category === "null") category = "Other";
                
                if (aggregatedMap.has(category)) {
                    aggregatedMap.set(category, aggregatedMap.get(category) + numericVal);
                } else {
                    aggregatedMap.set(category, numericVal);
                }
            }
            
            // Convert to array and filter zero values
            let finalSegments = Array.from(aggregatedMap.entries())
                .map(([lab, val]) => ({ lab, val }))
                .filter(d => d.val > 0);
            
            const totalValue = d3.sum(finalSegments, d => d.val);
            
            if (finalSegments.length === 0 || totalValue === 0) {
                container.append("div")
                    .attr("class", "empty-state-modern")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .html(`<span style="font-size:34px;">🍩</span><br/><span style="font-weight:500;">No positive values</span><br/><span style="font-size:12px;">Measure values sum to zero</span>`);
                return;
            }

            // sort slices by value descending for better UX
            finalSegments.sort((a,b) => b.val - a.val);
            
            // Dimensions for responsive donut
            const w = window.innerWidth;
            const h = window.innerHeight;
            const baseRadius = Math.min(w, h) * 0.31;
            const innerRadius = baseRadius * 0.68;
            const outerRadius = baseRadius;
            const cornerRadius = 12;
            
            // remove existing svg and create
            const svg = container.append("svg")
                .attr("width", w)
                .attr("height", h)
                .style("display", "block")
                .style("background", "transparent")
                .append("g")
                .attr("transform", `translate(${w/2}, ${h/2})`);
            
            // Color mapping: use Tableau palette if defined else our premium set
            const tableauColorLookup = encodings.colorsMap || {};
            const colorScale = d3.scaleOrdinal()
                .domain(finalSegments.map(d => d.lab))
                .range(PREMIUM_COLORS);
            
            const getFillColor = (label) => {
                if (tableauColorLookup[label]) return tableauColorLookup[label];
                return colorScale(label);
            };
            
            // pie generator with slight gap for modern "separated segments" look
            const pieLayout = d3.pie()
                .value(d => d.val)
                .padAngle(0.022)
                .sort(null);
            
            const arcGenerator = d3.arc()
                .innerRadius(innerRadius)
                .outerRadius(outerRadius)
                .cornerRadius(cornerRadius);
            
            const pieData = pieLayout(finalSegments);
            
            // Draw arcs with smooth transition & micro bounce
            const arcsGroup = svg.selectAll(".arc-group")
                .data(pieData)
                .enter()
                .append("g")
                .attr("class", "arc-group");
            
            arcsGroup.append("path")
                .attr("class", "arc")
                .attr("d", arcGenerator)
                .attr("fill", d => getFillColor(d.data.lab))
                .attr("stroke", "#FFFFFF")
                .attr("stroke-width", 3)
                .attr("stroke-linejoin", "round")
                .style("cursor", "pointer")
                .style("transition", "all 0.2s cubic-bezier(0.2,0.9,0.4,1.1)")
                .on("mouseover", function(event, sliceData) {
                    // animate hover arc scale via transform
                    d3.select(this).attr("stroke-width", 4.5).attr("stroke", "#FFFFFF");
                    // update tooltip
                    const percent = (sliceData.data.val / totalValue) * 100;
                    const percentFormatted = percent.toFixed(1);
                    const valFormatted = formatSmartNumber(sliceData.data.val);
                    d3.select("#dynamic-tooltip")
                        .style("opacity", 1)
                        .html(`<b>${safeText(sliceData.data.lab)}</b> &nbsp; <span>${valFormatted}</span> &nbsp; <span style="opacity:0.7;">(${percentFormatted}%)</span>`);
                    
                    // animate center text to slice value
                    centerValueText.text(formatSmartNumber(sliceData.data.val));
                    centerLabelText.text(sliceData.data.lab.length > 22 ? sliceData.data.lab.slice(0,20)+"…" : sliceData.data.lab);
                })
                .on("mousemove", function(event) {
                    d3.select("#dynamic-tooltip")
                        .style("left", (event.clientX + 16) + "px")
                        .style("top", (event.clientY - 42) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this).attr("stroke-width", 3).attr("stroke", "#FFFFFF");
                    d3.select("#dynamic-tooltip").style("opacity", 0);
                    centerValueText.text(formatSmartNumber(totalValue));
                    centerLabelText.text("TOTAL");
                });
            
            // center text group with lively animation
            const centerValueText = svg.append("text")
                .attr("class", "center-value-premium")
                .attr("dy", "-0.15em")
                .style("font-size", `${Math.min(baseRadius * 0.22, 56)}px`)
                .style("fill", "#0F2C4E")
                .text(formatSmartNumber(totalValue));
            
            const centerLabelText = svg.append("text")
                .attr("class", "center-label-premium")
                .attr("dy", "1.5em")
                .style("font-size", `${Math.max(9, baseRadius * 0.09)}px`)
                .text("TOTAL");
            
            // add a subtle inner glow ring
            svg.append("circle")
                .attr("r", innerRadius - 2)
                .attr("fill", "rgba(245, 248, 255, 0.6)")
                .attr("stroke", "rgba(0, 102, 204, 0.08)")
                .attr("stroke-width", 1.2)
                .style("pointer-events", "none");
            
            // add micro animation for donut enter (scale)
            svg.attr("opacity", 0)
                .transition()
                .duration(500)
                .ease(d3.easeCubicOut)
                .attr("opacity", 1);
        }
        
        // orchestrate: fetch data + encodings and render with loading state
        async function refreshVisualization() {
            if (!worksheet) return;
            
            const container = d3.select("#viz-container");
            // show micro loading only if needed (smooth)
            const existingHint = container.select(".temp-loading");
            if (existingHint.empty()) {
                container.append("div")
                    .attr("class", "temp-loading")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .style("background", "rgba(255,255,255,0.8)")
                    .style("borderRadius", "40px")
                    .style("padding", "10px 24px")
                    .style("fontSize", "13px")
                    .style("color", "#2c4f7c")
                    .style("backdropFilter", "blur(4px)")
                    .style("zIndex", "20")
                    .html("⟳ loading data...");
            }
            
            try {
                const [rawData, encodings] = await Promise.all([
                    fetchSummaryData(worksheet),
                    getActiveEncodings(worksheet)
                ]);
                container.selectAll(".temp-loading").remove();
                renderPremiumDonut(rawData, encodings);
            } catch (err) {
                container.selectAll(".temp-loading").remove();
                console.error(err);
                container.append("div")
                    .attr("class", "empty-state-modern")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .html(`<span>⚠️</span> Error loading data`);
            }
        }
        
        // resize handler with debounce for smooth canvas update
        function debouncedResize() {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (worksheet) refreshVisualization();
            }, 100);
        }
        
        // initialize Tableau extension with event listeners
        async function initExtension() {
            try {
                await tableau.extensions.initializeAsync();
                worksheet = tableau.extensions.worksheetContent.worksheet;
                if (!worksheet) {
                    d3.select("#viz-container").append("div")
                        .attr("class", "guidance-card")
                        .style("position", "absolute")
                        .style("top", "50%")
                        .style("left", "50%")
                        .style("transform", "translate(-50%, -50%)")
                        .html(`<div class="icon">📄</div><h3>No worksheet active</h3><p>Please open a worksheet with data.</p>`);
                    return;
                }
                // initial render
                await refreshVisualization();
                // Event listeners: when user changes encoding (dragging fields) or data updates
                worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, () => refreshVisualization());
                worksheet.addEventListener(tableau.TableauEventType.SelectionChanged, () => refreshVisualization());
                // listen to marks change via visual spec changed? using SummaryDataChanged covers most.
                // also watch resize
                window.addEventListener('resize', debouncedResize);
            } catch (err) {
                console.error("init error", err);
                d3.select("#viz-container").append("div")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .style("background", "white")
                    .style("borderRadius", "32px")
                    .style("padding", "16px 28px")
                    .style("boxShadow", "0 4px 12px rgba(0,0,0,0.05)")
                    .html(``);
            }
        }
        
        // start everything after window load
        window.addEventListener('load', () => {
            initExtension();
        });
    })();
</script>
</body>
</html>
