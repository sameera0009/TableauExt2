<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Donut Viz Extension</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
    <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent: #3b82f6;
            --track: #e2e8f0;
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
        }

        #content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            padding: 40px;
        }

        .donut-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .donut-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .state-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .value-subtitle {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        .donut-ring:hover {
            cursor: pointer;
            animation: blinker 0.8s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0.4; }
        }

        .setup-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="content"></div>

<script>
(function () {
    window.onload = tableau.extensions.initializeAsync().then(() => {
        const worksheet = tableau.extensions.worksheetContent.worksheet;

        const updateUI = async () => {
            const [data, encodings] = await Promise.all([
                getSummaryData(worksheet),
                getEncodings(worksheet)
            ]);
            render(data, encodings);
        };

        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateUI);
        updateUI();
    });

    async function getSummaryData(ws) {
        const reader = await ws.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });
        let rows = [];
        for (let i = 0; i < reader.pageCount; i++) {
            const page = await reader.getPageAsync(i);
            page.data.forEach(row => {
                const obj = {};
                page.columns.forEach((col, idx) => obj[col.fieldName] = row[idx]);
                rows.push(obj);
            });
        }
        await reader.releaseAsync();
        return rows;
    }

    async function getEncodings(ws) {
        const spec = await ws.getVisualSpecificationAsync();
        const map = {};
        if (spec.activeMarksSpecificationIndex >= 0) {
            const marks = spec.marksSpecifications[spec.activeMarksSpecificationIndex];
            marks.encodings.forEach(e => map[e.id] = e.field);
        }
        return map;
    }

    function render(data, encodings) {
        const container = d3.select("#content");
        container.html("");

        if (!encodings.x || !encodings.text) {
            container.append("div").attr("class", "setup-msg")
                .html("<h2>Welcome</h2><p>Drag your <b>Dimension</b> to Text and <b>Measure</b> to X shelf.</p>");
            return;
        }

        const nameField = encodings.text.name;
        const valField = encodings.x.name;
        const maxVal = d3.max(data, d => +d[valField].value) || 1;

        data.forEach((d, i) => {
            const rawVal = +d[valField].value;
            const percentage = (rawVal / maxVal) * 100;
            
            const card = container.append("div").attr("class", "donut-card");
            const svg = card.append("svg").attr("width", 150).attr("height", 150);
            const g = svg.append("g").attr("transform", "translate(75,75)");

            const arc = d3.arc().innerRadius(55).outerRadius(70).cornerRadius(10);
            const pie = d3.pie().sort(null).value(v => v);

            // Background Track
            g.append("path").datum([100]).attr("d", arc).attr("fill", "var(--track)");

            // Progress Arc
            const progress = g.append("path")
                .attr("class", "donut-ring")
                .attr("fill", "var(--accent)");

            // Percentage Text
            const pText = g.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", ".35em")
                .style("font-size", "1.4rem").style("font-weight", "800")
                .text("0%");

            card.append("div").attr("class", "state-title").text(d[nameField].formattedValue);
            card.append("div").attr("class", "value-subtitle").text(d[valField].formattedValue);

            // --- ANIMATIONS ---
            progress.transition()
                .duration(1500)
                .delay(i * 50)
                .ease(d3.easeExpoOut)
                .attrTween("d", function() {
                    const i = d3.interpolate(0, percentage);
                    return t => arc(pie([i(t), 100 - i(t)])[0]);
                });

            let counter = { v: 0 };
            gsap.to(counter, {
                v: percentage, 
                duration: 1.5, 
                delay: (i * 50) / 1000,
                ease: "expo.out",
                onUpdate: () => pText.text(Math.round(counter.v) + "%")
            });

            gsap.from(card.node(), { opacity: 0, y: 30, duration: 0.6, delay: i * 0.05 });
        });
    }
})();
</script>
</body>
</html>
