<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Hex Zoom Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
    <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <style>
        body { margin: 0; background: #061222; color: white; font-family: sans-serif; overflow: hidden; }
        #viz-container { width: 100vw; height: 100vh; position: relative; }
        svg { width: 100%; height: 100%; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; padding: 10px 20px;
            background: #4dabf7; border: none; color: white; border-radius: 5px;
            cursor: pointer; display: none; z-index: 100;
        }
        .tooltip {
            position: absolute; background: rgba(0,0,0,0.8); padding: 8px;
            border-radius: 4px; pointer-events: none; opacity: 0; font-size: 12px;
        }
    </style>
</head>
<body>

<button class="back-btn" id="backBtn">← Back to Map</button>
<div id="viz-container">
    <div class="tooltip" id="tooltip"></div>
</div>

<script>
let worksheet;
let isZoomed = false;
const container = d3.select("#viz-container");
const svg = container.append("svg");
const mainG = svg.append("g"); // Main group for zooming

window.onload = async () => {
    await tableau.extensions.initializeAsync();
    worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateData);
    updateData();
    
    document.getElementById("backBtn").onclick = resetZoom;
};

async function updateData() {
    const visualSpec = await worksheet.getVisualSpecificationAsync();
    const marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
    const encodingMap = {};
    marksCard.encodings.forEach(e => encodingMap[e.id] = e.field.name);

    const reader = await worksheet.getSummaryDataReaderAsync();
    const page = await reader.getPageAsync(0); // Fetch first page
    
    const data = page.data.map(r => ({
        state: r[page.columns.find(c => c.fieldName === encodingMap.state).index].formattedValue,
        sales: +r[page.columns.find(c => c.fieldName === encodingMap.sales).index].value,
        profit: +r[page.columns.find(c => c.fieldName === encodingMap.profit).index].value
    }));

    await reader.releaseAsync();
    renderMap(data);
}

function renderMap(data) {
    mainG.selectAll("*").remove();
    const width = window.innerWidth;
    const height = window.innerHeight;
    const cols = 8;
    const spacing = 90;

    const hexes = mainG.selectAll(".hex")
        .data(data)
        .enter().append("g")
        .attr("class", "hex")
        .attr("transform", (d, i) => {
            const row = Math.floor(i / cols);
            const x = (i % cols) * spacing + (row % 2 === 0 ? 0 : spacing/2) + 100;
            const y = row * (spacing * 0.85) + 100;
            return `translate(${x}, ${y})`;
        })
        .on("click", function(event, d) { zoomIn(d3.select(this), d); });

    hexes.append("polygon")
        .attr("points", getHexPoints(0, 0, 40))
        .attr("fill", d => d.profit >= 0 ? "#22c55e" : "#ef4444")
        .attr("stroke", "#061222")
        .attr("stroke-width", 2)
        .style("cursor", "pointer");

    hexes.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "5")
        .attr("fill", "white")
        .style("pointer-events", "none")
        .text(d => d.state.substring(0, 2).toUpperCase());
}

function zoomIn(element, data) {
    if (isZoomed) return;
    isZoomed = true;
    
    document.getElementById("backBtn").style.display = "block";
    const transform = d3.select(element.node()).attr("transform");
    const coords = transform.match(/translate\(([^,]+),([^)]+)\)/);
    const x = +coords[1], y = +coords[2];

    const scale = 4;
    const screenX = window.innerWidth / 2;
    const screenY = window.innerHeight / 2;

    gsap.to(mainG.node(), {
        duration: 0.8,
        attr: { transform: `translate(${screenX - x * scale}, ${screenY - y * scale}) scale(${scale})` },
        ease: "power2.inOut"
    });

    // Add Donut Chart inside the hexagon
    const donutG = element.append("g").attr("class", "donut-chart").attr("opacity", 0);
    const pieData = [
        { label: 'Profit', value: Math.max(0, data.profit), color: '#ffffff' },
        { label: 'Remaining', value: Math.max(0, data.sales - data.profit), color: 'rgba(255,255,255,0.2)' }
    ];

    const pie = d3.pie().value(d => d.value);
    const arc = d3.arc().innerRadius(15).outerRadius(25);

    donutG.selectAll("path")
        .data(pie(pieData))
        .enter().append("path")
        .attr("d", arc)
        .attr("fill", d => d.data.color);

    gsap.to(donutG.node(), { opacity: 1, duration: 0.4, delay: 0.5 });
    element.select("text").attr("opacity", 0);
}

function resetZoom() {
    isZoomed = false;
    document.getElementById("backBtn").style.display = "none";
    
    gsap.to(mainG.node(), {
        duration: 0.8,
        attr: { transform: "translate(0,0) scale(1)" },
        ease: "power2.inOut"
    });

    mainG.selectAll(".donut-chart").remove();
    mainG.selectAll("text").attr("opacity", 1);
}

function getHexPoints(cx, cy, r) {
    let p = [];
    for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - (Math.PI / 6);
        p.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
    }
    return p.join(" ");
}
</script>
</body>
</html>
