<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Hex Map</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
    <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <style>
        body { margin: 0; background: #061222; overflow: hidden; font-family: sans-serif; color: white; }
        #viz { width: 100vw; height: 100vh; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; padding: 10px 18px;
            background: #4dabf7; color: white; border: none; border-radius: 4px;
            cursor: pointer; display: none; z-index: 10;
        }
        .error-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #8892b0;
        }
    </style>
</head>
<body>

<button class="back-btn" id="backBtn">← Back to Map</button>
<div id="viz"></div>

<script>
let worksheet;
let isZoomed = false;
const svg = d3.select("#viz").append("svg");
const mainG = svg.append("g");

window.onload = async () => {
    try {
        // 1. Initialize
        await tableau.extensions.initializeAsync();
        worksheet = tableau.extensions.worksheetContent.worksheet;

        // 2. Listen for changes
        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, loadData);

        // 3. Initial Load
        loadData();
    } catch (e) {
        console.error("Initialization failed", e);
    }
};

async function loadData() {
    try {
        const visualSpec = await worksheet.getVisualSpecificationAsync();
        const marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
        
        // Map IDs from TREX to actual Field Names
        const encodingMap = {};
        marksCard.encodings.forEach(e => {
            encodingMap[e.id] = e.field.name;
        });

        // Check if fields are actually on the shelves
        if (!encodingMap.state || !encodingMap.sales || !encodingMap.profit) {
            d3.select("#viz").html(`
                <div class="error-overlay">
                    <h2>No Data Found</h2>
                    <p>Please drag fields to the <b>State, Sales,</b> and <b>Profit</b> shelves on the Marks Card.</p>
                </div>`);
            return;
        }

        const reader = await worksheet.getSummaryDataReaderAsync();
        const page = await reader.getPageAsync(0);
        
        // Convert Tableau data to JS objects
        const data = page.data.map(row => {
            const rowObj = {};
            page.columns.forEach((col, i) => {
                rowObj[col.fieldName] = row[i];
            });

            return {
                state: rowObj[encodingMap.state].formattedValue,
                sales: +rowObj[encodingMap.sales].value,
                profit: +rowObj[encodingMap.profit].value
            };
        });

        await reader.releaseAsync();
        render(data);

    } catch (err) {
        console.error("Data Load Error:", err);
    }
}

function render(data) {
    mainG.selectAll("*").remove();
    d3.select(".error-overlay").remove();

    const width = window.innerWidth;
    const height = window.innerHeight;
    const cols = 8;
    const spacing = 100;

    const hexes = mainG.selectAll(".hex")
        .data(data)
        .enter().append("g")
        .attr("class", "hex")
        .attr("transform", (d, i) => {
            const row = Math.floor(i / cols);
            const x = (i % cols) * spacing + (row % 2 === 0 ? 0 : spacing/2) + 100;
            const y = row * (spacing * 0.8) + 100;
            return `translate(${x}, ${y})`;
        })
        .on("click", function(e, d) { zoomIn(d3.select(this), d); });

    hexes.append("polygon")
        .attr("points", getHexPoints(0, 0, 45))
        .attr("fill", d => d.profit >= 0 ? "#22c55e" : "#ef4444")
        .attr("stroke", "#061222")
        .attr("stroke-width", 3);

    hexes.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "5")
        .attr("fill", "white")
        .style("font-weight", "bold")
        .style("pointer-events", "none")
        .text(d => d.state.substring(0, 2).toUpperCase());
}

function zoomIn(element, data) {
    if (isZoomed) return;
    isZoomed = true;
    document.getElementById("backBtn").style.display = "block";

    const transform = element.attr("transform");
    const coords = transform.match(/translate\(([^, ]+)[, ]+([^)]+)\)/);
    const x = +coords[1], y = +coords[2];

    const scale = 5;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    gsap.to(mainG.node(), {
        duration: 0.8,
        attr: { transform: `translate(${centerX - x * scale}, ${centerY - y * scale}) scale(${scale})` },
        ease: "power3.inOut"
    });

    // Create Donut
    const donutG = element.append("g").attr("class", "donut").attr("opacity", 0);
    const pieData = [{v: Math.max(0, data.profit), c: "white"}, {v: Math.max(1, data.sales), c: "rgba(255,255,255,0.2)"}];
    const arc = d3.arc().innerRadius(15).outerRadius(25);
    const pie = d3.pie().value(d => d.v).sort(null);

    donutG.selectAll("path").data(pie(pieData)).enter()
        .append("path").attr("d", arc).attr("fill", d => d.data.c);

    gsap.to(donutG.node(), { opacity: 1, duration: 0.4, delay: 0.4 });
    element.select("text").transition().duration(200).attr("opacity", 0);
}

document.getElementById("backBtn").onclick = () => {
    isZoomed = false;
    document.getElementById("backBtn").style.display = "none";
    gsap.to(mainG.node(), { duration: 0.8, attr: { transform: "translate(0,0) scale(1)" }, ease: "power3.inOut" });
    mainG.selectAll(".donut").remove();
    mainG.selectAll("text").attr("opacity", 1);
};

function getHexPoints(cx, cy, r) {
    let p = [];
    for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - (Math.PI / 6);
        p.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);
    }
    return p.join(" ");
}
</script>
</body>
</html>
