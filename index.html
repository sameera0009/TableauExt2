<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8"/>

  <title>Data Pulse KPI Extension</title>

  <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-[#050816] text-white overflow-hidden">

  <div class="w-full h-screen p-4">

    <!-- HEADER -->

    <div class="flex justify-between items-center mb-4">

      <div>

        <h1 class="text-3xl font-bold">
          Data Pulse Analytics
        </h1>

        <div class="text-gray-400">
          Live Tableau Viz Extension
        </div>

      </div>

      <div
        id="status"
        class="bg-green-500/20 text-green-400 px-4 py-2 rounded-xl">

        Connected

      </div>

    </div>

    <!-- KPI CARDS -->

    <div class="grid grid-cols-4 gap-4 mb-4">

      <div class="bg-gradient-to-br from-cyan-500 to-blue-700 rounded-2xl p-5 shadow-2xl">

        <div class="text-sm opacity-80">
          Total Sales
        </div>

        <div
          id="salesKpi"
          class="text-4xl font-bold mt-2">

          0

        </div>

      </div>

      <div class="bg-gradient-to-br from-green-500 to-emerald-700 rounded-2xl p-5 shadow-2xl">

        <div class="text-sm opacity-80">
          Total Profit
        </div>

        <div
          id="profitKpi"
          class="text-4xl font-bold mt-2">

          0

        </div>

      </div>

      <div class="bg-gradient-to-br from-orange-500 to-red-700 rounded-2xl p-5 shadow-2xl">

        <div class="text-sm opacity-80">
          Orders
        </div>

        <div
          id="ordersKpi"
          class="text-4xl font-bold mt-2">

          0

        </div>

      </div>

      <div class="bg-gradient-to-br from-purple-500 to-pink-700 rounded-2xl p-5 shadow-2xl">

        <div class="text-sm opacity-80">
          Avg Profit Ratio
        </div>

        <div
          id="ratioKpi"
          class="text-4xl font-bold mt-2">

          0%

        </div>

      </div>

    </div>

    <!-- MAIN GRID -->

    <div class="grid grid-cols-12 gap-4 h-[78vh]">

      <!-- LEFT -->

      <div class="col-span-8 flex flex-col gap-4">

        <!-- TOP STATES -->

        <div class="bg-[#0f172a] rounded-2xl p-4 flex-1">

          <div class="flex justify-between items-center mb-3">

            <h2 class="text-xl font-bold">
              Top States by Sales
            </h2>

            <div class="text-gray-400 text-sm">
              Bubble Size = Sales
            </div>

          </div>

          <div
            id="bubbleChart"
            class="w-full h-[320px]">
          </div>

        </div>

        <!-- TREND -->

        <div class="bg-[#0f172a] rounded-2xl p-4 flex-1">

          <div class="flex justify-between items-center mb-3">

            <h2 class="text-xl font-bold">
              Profit Distribution
            </h2>

          </div>

          <div
            id="barChart"
            class="w-full h-[320px]">
          </div>

        </div>

      </div>

      <!-- RIGHT -->

      <div class="col-span-4 flex flex-col gap-4">

        <!-- TOP PERFORMERS -->

        <div class="bg-[#0f172a] rounded-2xl p-4">

          <h2 class="text-xl font-bold mb-4">
            Top Performers
          </h2>

          <div
            id="topPerformers"
            class="space-y-3">
          </div>

        </div>

        <!-- INSIGHTS -->

        <div class="bg-[#0f172a] rounded-2xl p-4 flex-1">

          <h2 class="text-xl font-bold mb-4">
            Smart Insights
          </h2>

          <div
            id="insights"
            class="space-y-4 text-sm">
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    let worksheet;

    async function init() {

      try {

        await tableau.extensions.initializeAsync();

        worksheet =
          tableau.extensions.worksheetContent.worksheet;

        console.log("Connected");

        await loadData();

        worksheet.addEventListener(
          tableau.TableauEventType.SummaryDataChanged,
          loadData
        );

      } catch (err) {

        console.error(err);

        document.getElementById("status")
          .innerHTML = "Connection Failed";
      }
    }

    async function loadData() {

      try {

        const reader =
          await worksheet.getSummaryDataReaderAsync();

        const page =
          await reader.getPageAsync(0);

        const columns =
          reader.columns.map(c => c.fieldName);

        const rows =
          page.data;

        const data = [];

        rows.forEach(r => {

          const obj = {};

          columns.forEach((c, i) => {

            obj[c] = r[i].value;
          });

          data.push(obj);
        });

        console.log(data);

        processData(data);

      } catch (err) {

        console.error(err);
      }
    }

    function findField(columns, names) {

      return columns.find(c =>

        names.some(n =>
          c.toLowerCase().includes(n)
        )
      );
    }

    function processData(data) {

      if (!data.length) return;

      const cols =
        Object.keys(data[0]);

      const salesField =
        findField(cols, ["sales"]);

      const profitField =
        findField(cols, ["profit"]);

      const stateField =
        findField(cols, ["state"]);

      const orderField =
        findField(cols, ["order"]);

      console.log({
        salesField,
        profitField,
        stateField
      });

      let totalSales = 0;
      let totalProfit = 0;

      const stateAgg = {};

      data.forEach(d => {

        const sales =
          Number(d[salesField]) || 0;

        const profit =
          Number(d[profitField]) || 0;

        const state =
          d[stateField] || "Unknown";

        totalSales += sales;
        totalProfit += profit;

        if (!stateAgg[state]) {

          stateAgg[state] = {

            sales: 0,
            profit: 0
          };
        }

        stateAgg[state].sales += sales;
        stateAgg[state].profit += profit;
      });

      updateKpis(
        totalSales,
        totalProfit,
        data.length
      );

      renderBubble(stateAgg);

      renderBar(stateAgg);

      renderTop(stateAgg);

      renderInsights(
        totalSales,
        totalProfit,
        stateAgg
      );
    }

    function updateKpis(
      sales,
      profit,
      orders
    ) {

      document.getElementById(
        "salesKpi"
      ).innerText =
        "$" + Math.round(sales).toLocaleString();

      document.getElementById(
        "profitKpi"
      ).innerText =
        "$" + Math.round(profit).toLocaleString();

      document.getElementById(
        "ordersKpi"
      ).innerText =
        orders.toLocaleString();

      const ratio =
        ((profit / sales) * 100)
        .toFixed(1);

      document.getElementById(
        "ratioKpi"
      ).innerText =
        ratio + "%";

      gsap.from(
        ".text-4xl",
        {
          duration: 1,
          y: 20,
          opacity: 0,
          stagger: 0.1
        }
      );
    }

    function renderBubble(stateAgg) {

      const chart =
        echarts.init(
          document.getElementById(
            "bubbleChart"
          )
        );

      const data =
        Object.entries(stateAgg)
          .map(([k, v]) => ({

            name: k,

            value: [
              v.sales,
              v.profit,
              v.sales
            ]
          }))
          .slice(0, 20);

      chart.setOption({

        backgroundColor: "transparent",

        tooltip: {},

        xAxis: {
          name: "Sales"
        },

        yAxis: {
          name: "Profit"
        },

        series: [

          {

            type: "scatter",

            symbolSize: d =>
              Math.sqrt(d[2]) / 12,

            data: data,

            emphasis: {
              focus: "series"
            }
          }
        ]
      });
    }

    function renderBar(stateAgg) {

      const chart =
        echarts.init(
          document.getElementById(
            "barChart"
          )
        );

      const sorted =
        Object.entries(stateAgg)
          .sort((a, b) =>

            b[1].profit -
            a[1].profit
          )
          .slice(0, 10);

      chart.setOption({

        backgroundColor: "transparent",

        tooltip: {},

        xAxis: {

          type: "category",

          data:
            sorted.map(x => x[0]),

          axisLabel: {

            rotate: 25
          }
        },

        yAxis: {

          type: "value"
        },

        series: [

          {

            type: "bar",

            data:
              sorted.map(
                x => x[1].profit
              ),

            barWidth: "55%"
          }
        ]
      });
    }

    function renderTop(stateAgg) {

      const container =
        document.getElementById(
          "topPerformers"
        );

      container.innerHTML = "";

      const sorted =
        Object.entries(stateAgg)
          .sort((a, b) =>

            b[1].sales -
            a[1].sales
          )
          .slice(0, 5);

      sorted.forEach((x, i) => {

        const div =
          document.createElement("div");

        div.className =
          "bg-[#1e293b] p-4 rounded-xl";

        div.innerHTML = `

          <div class="flex justify-between">

            <div>

              <div class="font-bold">
                #${i + 1} ${x[0]}
              </div>

              <div class="text-gray-400 text-sm">
                Profit:
                $${Math.round(
                  x[1].profit
                ).toLocaleString()}
              </div>

            </div>

            <div class="text-cyan-400 font-bold">

              $${Math.round(
                x[1].sales
              ).toLocaleString()}

            </div>

          </div>
        `;

        container.appendChild(div);
      });
    }

    function renderInsights(
      sales,
      profit,
      stateAgg
    ) {

      const container =
        document.getElementById(
          "insights"
        );

      container.innerHTML = "";

      const best =
        Object.entries(stateAgg)
          .sort((a, b) =>

            b[1].profit -
            a[1].profit
          )[0];

      const worst =
        Object.entries(stateAgg)
          .sort((a, b) =>

            a[1].profit -
            b[1].profit
          )[0];

      const insights = [

        `
          <div class="bg-[#1e293b] p-4 rounded-xl">
            <div class="font-bold text-green-400">
              Best Performing State
            </div>

            <div class="mt-2">
              ${best[0]}
            </div>

            <div class="text-gray-400">
              Profit:
              $${Math.round(
                best[1].profit
              ).toLocaleString()}
            </div>
          </div>
        `,

        `
          <div class="bg-[#1e293b] p-4 rounded-xl">
            <div class="font-bold text-red-400">
              Lowest Performing State
            </div>

            <div class="mt-2">
              ${worst[0]}
            </div>

            <div class="text-gray-400">
              Profit:
              $${Math.round(
                worst[1].profit
              ).toLocaleString()}
            </div>
          </div>
        `,

        `
          <div class="bg-[#1e293b] p-4 rounded-xl">
            <div class="font-bold text-cyan-400">
              Profit Margin
            </div>

            <div class="mt-2 text-2xl font-bold">
              ${(
                (profit / sales) * 100
              ).toFixed(2)}%
            </div>
          </div>
        `
      ];

      container.innerHTML =
        insights.join("");
    }

    init();

  </script>

</body>
</html>
