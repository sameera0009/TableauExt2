<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Donut Hex Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
    <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --primary: #4e79a7;
            --text: #2c3e50;
        }

        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; 
        }

        #app {
            display: flex; flex-wrap: wrap; gap: 20px; padding: 30px;
            height: 100vh; width: 100vw; justify-content: center; align-items: center;
        }

        .donut-card {
            background: var(--card);
            width: 260px; height: 320px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; transition: transform 0.3s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .donut-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .state-label {
            font-size: 18px; font-weight: 700; margin-top: 15px; color: var(--text);
        }

        .sales-label {
            font-size: 14px; opacity: 0.6; margin-top: 4px;
        }

        .middle-number {
            font-size: 22px; font-weight: 800; fill: var(--primary);
        }

        /* Hover Blink Animation */
        .donut-path:hover {
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #debug-msg {
            position: absolute; top: 20px; background: #ff4757; color: white;
            padding: 10px 20px; border-radius: 10px; display: none; z-index: 100;
        }
    </style>
</head>
<body>

<div id="debug-msg"></div>
<div id="app">
    <!-- Cards will be injected here -->
</div>

<script>
let worksheet;

window.onload = async () => {
    try {
        await tableau.extensions.initializeAsync();
        worksheet = tableau.extensions.worksheetContent.worksheet;
        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, fetchTableauData);
        fetchTableauData();
    } catch (e) {
        console.error("Extension init failed", e);
    }
};

async function fetchTableauData() {
    const debug = document.getElementById("debug-msg");
    try {
        const visualSpec = await worksheet.getVisualSpecificationAsync();
        const marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
        
        const encodingMap = {};
        marksCard.encodings.forEach(e => encodingMap[e.id] = e.field.name);

        if (!encodingMap.state || !encodingMap.sales) {
            debug.style.display = "block";
            debug.innerText = "Setup Required: Drag 'State' and 'Sales' to the Marks Card shelves.";
            return;
        }
        debug.style.display = "none";

        const reader = await worksheet.getSummaryDataReaderAsync();
        const page = await reader.getPageAsync(0);
        
        const data = page.data.map(row => {
            const rowData = {};
            page.columns.forEach((col, i) => rowData[col.fieldName] = row[i]);
            return {
                state: rowData[encodingMap.state].formattedValue,
                sales: +rowData[encodingMap.sales].value
            };
        });

        await reader.releaseAsync();
        renderCards(data);
    } catch (err) {
        console.error(err);
    }
}

function renderCards(data) {
    const container = d3.select("#app");
    container.selectAll("*").remove();

    const maxSales = d3.max(data, d => d.sales);

    data.forEach((d, i) => {
        const card = container.append("div").attr("class", "donut-card");
        
        const svg = card.append("svg").attr("width", 160).attr("height", 160);
        const g = svg.append("g").attr("transform", "translate(80,80)");

        // Donut Logic
        const radius = 70;
        const thickness = 12;
        const arc = d3.arc().innerRadius(radius - thickness).outerRadius(radius).cornerRadius(10);
        const pie = d3.pie().sort(null).value(val => val);

        // Background Track
        g.append("path")
            .datum([100])
            .attr("d", arc)
            .attr("fill", "#eceff1");

        // Foreground Arc (Animate this)
        const foreground = g.append("path")
            .attr("class", "donut-path")
            .attr("fill", "#4e79a7");

        // Middle Number (Animate this)
        const text = g.append("text")
            .attr("class", "middle-number")
            .attr("text-anchor", "middle")
            .attr("dy", ".35em")
            .text("0");

        // Labels
        card.append("div").attr("class", "state-label").text(d.state);
        card.append("div").attr("class", "sales-label").text("$" + Math.round(d.sales).toLocaleString());

        // --- ANIMATIONS ---
        
        // 1. Animate Donut
        const targetValue = (d.sales / maxSales) * 100;
        foreground.transition()
            .duration(1500)
            .delay(i * 100)
            .ease(d3.easeExpoOut)
            .attrTween("d", function() {
                const interpolate = d3.interpolate(0, targetValue);
                return function(t) {
                    return arc(pie([interpolate(t), 100 - interpolate(t)])[0]);
                };
            });

        // 2. Animate Number Counter
        let counter = { val: 0 };
        gsap.to(counter, {
            val: targetValue,
            duration: 1.5,
            delay: (i * 100) / 1000,
            ease: "expo.out",
            onUpdate: () => {
                text.text(Math.round(counter.val) + "%");
            }
        });

        // 3. Card Entrance
        gsap.from(card.node(), {
            opacity: 0,
            y: 30,
            scale: 0.9,
            duration: 0.8,
            delay: i * 0.05,
            ease: "back.out(1.7)"
        });
    });
}
</script>
</body>
</html>
