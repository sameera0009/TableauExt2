<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8"/>

  <title>Hexbin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
  <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#061222;
      font-family:Arial, sans-serif;
      color:white;
      overflow:hidden;
    }

    #app{
      padding:18px;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      margin-bottom:18px;
    }

    .title{
      font-size:28px;
      font-weight:700;
      letter-spacing:1px;
    }

    .subtitle{
      opacity:.7;
      margin-top:4px;
    }

    .kpiRow{
      display:flex;
      gap:16px;
      margin-bottom:18px;
    }

    .kpi{
      flex:1;
      background:linear-gradient(
        145deg,
        #102746,
        #0b1830
      );

      border-radius:18px;
      padding:22px;

      box-shadow:
      0 8px 30px rgba(0,0,0,.35);

      position:relative;
      overflow:hidden;
    }

    .kpi::before{
      content:"";
      position:absolute;
      top:-30px;
      right:-30px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:rgba(255,255,255,.05);
    }

    .kpiLabel{
      opacity:.7;
      font-size:14px;
      margin-bottom:10px;
    }

    .kpiValue{
      font-size:34px;
      font-weight:bold;
    }

    .main{
      flex:1;
      display:flex;
      gap:18px;
      min-height:0;
    }

    #hexMap{
      flex:3;
      background:#0c1d35;
      border-radius:22px;
      position:relative;
      overflow:hidden;
    }

    .sidePanel{
      flex:1;
      background:#0c1d35;
      border-radius:22px;
      padding:18px;
      overflow:auto;
    }

    .panelTitle{
      font-size:18px;
      font-weight:700;
      margin-bottom:18px;
    }

    .rankItem{
      background:#102746;
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;

      transition:.25s;
      cursor:pointer;
    }

    .rankItem:hover{
      transform:translateX(5px);
      background:#16345f;
    }

    .rankState{
      font-size:16px;
      font-weight:700;
    }

    .rankProfit{
      opacity:.75;
      margin-top:4px;
      font-size:13px;
    }

    .tooltip{
      position:absolute;
      background:#09111d;
      border:1px solid rgba(255,255,255,.15);
      padding:12px;
      border-radius:12px;
      pointer-events:none;
      opacity:0;
      transition:.2s;
      font-size:13px;
      z-index:999;
      min-width:140px;
    }

  </style>

</head>

<body>

<div id="app">

  <div class="header">

    <div class="title">
      HEXBIN PERFORMANCE DASHBOARD
    </div>

    <div class="subtitle">
      Tableau Viz Extension
    </div>

  </div>

  <div class="kpiRow">

    <div class="kpi">
      <div class="kpiLabel">
        TOTAL SALES
      </div>

      <div class="kpiValue" id="salesKpi">
        $0
      </div>
    </div>

    <div class="kpi">
      <div class="kpiLabel">
        TOTAL PROFIT
      </div>

      <div class="kpiValue" id="profitKpi">
        $0
      </div>
    </div>

    <div class="kpi">
      <div class="kpiLabel">
        BEST STATE
      </div>

      <div class="kpiValue" id="bestState">
        -
      </div>
    </div>

  </div>

  <div class="main">

    <div id="hexMap">

      <div class="tooltip" id="tooltip"></div>

    </div>

    <div class="sidePanel">

      <div class="panelTitle">
        TOP PROFIT STATES
      </div>

      <div id="ranking"></div>

    </div>

  </div>

</div>

<script>

let worksheet;

window.onload = async () => {

  try{

    await tableau.extensions.initializeAsync();

    worksheet =
      tableau.extensions.worksheetContent.worksheet;

    worksheet.addEventListener(
      tableau.TableauEventType.SummaryDataChanged,
      loadData
    );

    loadData();

  }catch(err){

    console.error(err);

    alert(
      "Extension initialization failed"
    );
  }
};

async function loadData(){

  try{

    const visualSpec =
      await worksheet.getVisualSpecificationAsync();

    const marksCard =
      visualSpec.marksSpecifications[
        visualSpec.activeMarksSpecificationIndex
      ];

    const encodingMap = {};

    marksCard.encodings.forEach(enc => {

      encodingMap[enc.id] = enc.field.name;

    });

    if(
      !encodingMap.state ||
      !encodingMap.sales ||
      !encodingMap.profit
    ){

      document.getElementById("hexMap").innerHTML = `
        <div style="
          padding:40px;
          color:white;
          font-size:20px;
        ">
          Drag fields to:
          <br/><br/>
          • State → State shelf
          <br/>
          • SUM(Sales) → Sales shelf
          <br/>
          • SUM(Profit) → Profit shelf
        </div>
      `;

      return;
    }

    const dataReader =
      await worksheet.getSummaryDataReaderAsync();

    let rows = [];

    for(let p=0; p<dataReader.pageCount; p++){

      const page =
        await dataReader.getPageAsync(p);

      rows = rows.concat(page.data);
    }

    const columns = dataReader.columns;

    await dataReader.releaseAsync();

    const stateIndex =
      columns.findIndex(
        c => c.fieldName === encodingMap.state
      );

    const salesIndex =
      columns.findIndex(
        c => c.fieldName === encodingMap.sales
      );

    const profitIndex =
      columns.findIndex(
        c => c.fieldName === encodingMap.profit
      );

    const data = rows.map(r => ({

      state:
        r[stateIndex]?.formattedValue || "",

      sales:
        +r[salesIndex]?.value || 0,

      profit:
        +r[profitIndex]?.value || 0

    }));

    render(data);

  }catch(err){

    console.error(err);

    document.getElementById("hexMap").innerHTML = `
      <div style="
        padding:30px;
        color:#ff6b6b;
        font-size:18px;
      ">
        Connection Failed<br/><br/>
        ${err.message}
      </div>
    `;
  }
}
function render(data){

  renderKPIs(data);

  renderRanking(data);

  renderHexMap(data);

  gsap.from(".kpi",{
    y:40,
    opacity:0,
    duration:1,
    stagger:.12
  });

}

function renderKPIs(data){

  const totalSales =
    data.reduce((a,b)=>a+b.sales,0);

  const totalProfit =
    data.reduce((a,b)=>a+b.profit,0);

  const best =
    [...data]
    .sort((a,b)=>b.profit-a.profit)[0];

  document.getElementById("salesKpi")
    .innerText =
      "$" + Math.round(totalSales)
      .toLocaleString();

  document.getElementById("profitKpi")
    .innerText =
      "$" + Math.round(totalProfit)
      .toLocaleString();

  document.getElementById("bestState")
    .innerText =
      best?.state || "-";
}

function renderRanking(data){

  const container =
    document.getElementById("ranking");

  container.innerHTML = "";

  data
    .sort((a,b)=>b.profit-a.profit)
    .slice(0,10)
    .forEach((d,i)=>{

      container.innerHTML += `

        <div class="rankItem">

          <div class="rankState">
            #${i+1} ${d.state}
          </div>

          <div class="rankProfit">
            Profit:
            $${Math.round(d.profit)
            .toLocaleString()}
          </div>

        </div>
      `;
    });
}

function renderHexMap(data){

  const container =
    document.getElementById("hexMap");

  const tooltip =
    document.getElementById("tooltip");

  container.innerHTML =
    '<div class="tooltip" id="tooltip"></div>';

  const width =
    container.clientWidth;

  const height =
    container.clientHeight;

  const svg =
    d3.select(container)
    .append("svg")
    .attr("width",width)
    .attr("height",height);

  const cols = 8;

  const maxSales =
    d3.max(data,d=>d.sales);

  data.forEach((d,i)=>{

    const x =
      (i % cols) * 120 + 90;

    const y =
      Math.floor(i/cols)*100 + 90;

    const radius =
      22 + (d.sales/maxSales)*30;

    const color =
      d.profit >= 0
      ? "#22c55e"
      : "#ef4444";

    svg
      .append("polygon")
      .attr("points",hexagon(x,y,radius))
      .attr("fill",color)
      .attr("stroke","white")
      .attr("stroke-width",2)
      .attr("opacity",0.9)
      .style("cursor","pointer")

      .on("mouseover",(event)=>{

        tooltip.style.opacity = 1;

        tooltip.innerHTML = `

          <b>${d.state}</b><br/><br/>

          Sales:
          $${Math.round(d.sales)
          .toLocaleString()}<br/>

          Profit:
          $${Math.round(d.profit)
          .toLocaleString()}
        `;
      })

      .on("mousemove",(event)=>{

        tooltip.style.left =
          event.offsetX + 20 + "px";

        tooltip.style.top =
          event.offsetY + 20 + "px";
      })

      .on("mouseout",()=>{

        tooltip.style.opacity = 0;
      });

    svg
      .append("text")
      .attr("x",x)
      .attr("y",y+4)
      .attr("text-anchor","middle")
      .attr("fill","white")
      .attr("font-size","11px")
      .attr("font-weight","bold")
      .text(
        d.state.substring(0,2)
      );

  });

  gsap.from("polygon",{
    scale:0,
    transformOrigin:"center",
    stagger:.02,
    duration:.6,
    ease:"back.out(1.7)"
  });

}

function hexagon(cx,cy,r){

  let points=[];

  for(let i=0;i<6;i++){

    const angle =
      Math.PI/3*i;

    const x =
      cx + r*Math.cos(angle);

    const y =
      cy + r*Math.sin(angle);

    points.push(x+","+y);
  }

  return points.join(" ");
}

</script>

</body>
</html>
