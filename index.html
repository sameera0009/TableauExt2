<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lumina Donut | Modern Tableau Viz Extension</title>
    <!-- Tableau Extension API & D3 -->
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- Modern Font: Plus Jakarta Sans for clean UI/UX -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* smoother UI feel, avoid accidental text selection */
        }

        body, html {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0f1c, #03060c);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* animated gradient overlay for ambient modern effect */
        .glow-orb {
            position: fixed;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: -20%;
            right: -20%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            animation: slowDrift 24s infinite alternate ease-in-out;
        }

        .glow-orb-2 {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(255, 80, 200, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -30%;
            left: -20%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(70px);
            animation: slowDriftReverse 30s infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(5%, 5%) scale(1.2); opacity: 0.8; }
        }

        @keyframes slowDriftReverse {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-8%, -6%) scale(1.3); opacity: 0.7; }
        }

        /* main canvas container */
        #viz-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* modern floating tooltip - frosted glass */
        .modern-tooltip {
            position: fixed;
            background: rgba(18, 25, 40, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 500;
            color: #f0f4ff;
            border: 1px solid rgba(0, 230, 255, 0.4);
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(0, 230, 255, 0.2) inset;
            font-family: 'Inter', monospace;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.2s ease, transform 0.1s;
            letter-spacing: 0.2px;
            white-space: nowrap;
            backdrop-filter: blur(12px);
        }

        .modern-tooltip b {
            color: #5effe6;
            font-weight: 600;
        }

        /* subtle loading / no-data state */
        .state-message {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 12px 24px;
            font-size: 14px;
            color: #b9c8ff;
            border: 1px solid rgba(0, 220, 250, 0.3);
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* better responsiveness for SVG text */
        svg {
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
        }

        .arc {
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            stroke-linejoin: round;
        }

        .arc:hover {
            filter: drop-shadow(0 0 12px currentColor) brightness(1.15);
            transform: scale(1.01);
            transition: transform 0.1s;
        }

        /* center text modern typography */
        .center-value-modern {
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
            letter-spacing: -0.5px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        .center-label-modern {
            fill: #94a9d4;
            text-anchor: middle;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            dominant-baseline: middle;
        }

        /* small legend hint absolute - modern minimal */
        .legend-hint {
            position: absolute;
            bottom: 18px;
            right: 20px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 10px;
            color: #b7ceff;
            font-weight: 400;
            letter-spacing: 0.4px;
            border: 0.5px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            z-index: 3;
            font-family: 'Inter', monospace;
        }
    </style>
</head>
<body>
<div class="glow-orb"></div>
<div class="glow-orb-2"></div>
<div id="viz-container"></div>
<div id="dynamic-tooltip" class="modern-tooltip" style="opacity:0; visibility: visible;"></div>

<script>
    (function() {
        'use strict';

        let worksheet;
        let currentResizeObserver = null;

        // 🎨 Refined, modern neon-meets-soft palette (accessible & vibrant)
        const MODERN_PALETTE = [
            "#2AFFD2", // electric mint
            "#FF4D8C", // vivid pink
            "#7C4DFF", // bright purple
            "#FFB347", // warm apricot
            "#3D8AFF", // electric blue
            "#FF6E6E", // coral peach
            "#28E1B0", // sea foam
            "#CD7AFF", // lavender
            "#FFB347", // gold
            "#FF6AC2"  // bubblegum
        ];

        // Utility: get summary data with modern error resilience
        async function getSummaryDataTable(ws) {
            let rows = [];
            try {
                const reader = await ws.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });
                for (let i = 0; i < reader.pageCount; i++) {
                    const page = await reader.getPageAsync(i);
                    rows = rows.concat(page.data.map(r => {
                        const row = {};
                        page.columns.forEach((col, idx) => { row[col.fieldName] = r[idx]; });
                        return row;
                    }));
                }
                await reader.releaseAsync();
                return rows;
            } catch (err) {
                console.warn("Error fetching summary data:", err);
                return [];
            }
        }

        async function getEncodingMap(ws) {
            try {
                const spec = await ws.getVisualSpecificationAsync();
                const map = { colors: {} };
                if (!spec || spec.activeMarksSpecificationIndex < 0) return map;
                const marks = spec.marksSpecifications[spec.activeMarksSpecificationIndex];
                if (marks && marks.encodings) {
                    marks.encodings.forEach(e => { map[e.id] = e.field; });
                }
                if (marks && marks.colorPalette && marks.colorPalette.paletteEntries) {
                    marks.colorPalette.paletteEntries.forEach(entry => {
                        map.colors[entry.value] = entry.color;
                    });
                }
                return map;
            } catch (err) {
                console.warn("Encoding extraction failed", err);
                return { colors: {} };
            }
        }

        // ---------- RENDER ENGINE with modern smooth design ----------
        function renderDonut(data, encodings) {
            const container = d3.select("#viz-container");
            container.selectAll("svg").remove();

            // Validation: require angle (measure) and color (dimension)
            if (!encodings.angle || !encodings.color || !data || data.length === 0) {
                container.append("div")
                    .attr("class", "state-message")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .style("white-space", "nowrap")
                    .html("✨ Assign a <b>Measure</b> to Angle & a <b>Dimension</b> to Color ✨");
                return;
            }

            // Process data: aggregate by color dimension
            const processed = data.map(d => ({
                val: parseFloat(d[encodings.angle.name]?.nativeValue) || 0,
                lab: d[encodings.color.name]?.formattedValue || "Undefined"
            }));

            // aggregate by label
            const groupedMap = new Map();
            for (let item of processed) {
                const existing = groupedMap.get(item.lab);
                if (existing) existing.val += item.val;
                else groupedMap.set(item.lab, { lab: item.lab, val: item.val });
            }
            let finalData = Array.from(groupedMap.values()).filter(d => d.val > 0);
            const total = d3.sum(finalData, d => d.val);
            if (total === 0 || finalData.length === 0) {
                container.append("div")
                    .attr("class", "state-message")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .html("📊 No positive values to display. Check your measure data.");
                return;
            }

            // sort nicely by value descending for visual clarity
            finalData.sort((a,b) => b.val - a.val);

            // dimensions
            const w = window.innerWidth, h = window.innerHeight;
            const radiusBase = Math.min(w, h) * 0.32; // adaptive radius
            const innerRadiusFactor = 0.68;   // modern thicker donut with nice depth
            const outerRadius = radiusBase;
            const innerRadius = outerRadius * innerRadiusFactor;
            const cornerRad = 10;

            const svg = container.append("svg")
                .attr("width", w)
                .attr("height", h)
                .style("display", "block")
                .append("g")
                .attr("transform", `translate(${w/2}, ${h/2})`);

            // color mapping: merge Tableau assigned colors + modern extension fallback
            const tableauColorMap = encodings.colors || {};
            const customColorScale = d3.scaleOrdinal()
                .domain(finalData.map(d => d.lab))
                .range(MODERN_PALETTE);
            
            const getSegmentColor = (segmentLabel) => {
                if (tableauColorMap[segmentLabel]) return tableauColorMap[segmentLabel];
                return customColorScale(segmentLabel);
            };

            // pie generator with padding for sleek segmentation
            const pieGen = d3.pie()
                .value(d => d.val)
                .padAngle(0.025)   // refined spacing gives modern "pill" separation
                .sort(null);

            const arcGenerator = d3.arc()
                .innerRadius(innerRadius)
                .outerRadius(outerRadius)
                .cornerRadius(cornerRad);

            // hover highlight arc (scale effect)
            const arcsData = pieGen(finalData);
            
            // draw segments
            const paths = svg.selectAll(".arc")
                .data(arcsData)
                .enter()
                .append("path")
                .attr("class", "arc")
                .attr("d", arcGenerator)
                .attr("fill", d => getSegmentColor(d.data.lab))
                .attr("stroke", "rgba(8, 14, 24, 0.8)")
                .attr("stroke-width", 2.5)
                .attr("stroke-linejoin", "round")
                .style("cursor", "pointer")
                .style("transition", "filter 0.2s, transform 0.2s")
                .style("transform-origin", "center");

            // tooltip & dynamic center text update
            const tooltipEl = d3.select("#dynamic-tooltip");
            const centerValText = svg.append("text")
                .attr("class", "center-value-modern")
                .attr("dy", "-0.2em")
                .style("font-size", `${Math.min(outerRadius * 0.22, 52)}px`)
                .style("font-weight", "700")
                .text(formatNumber(total));

            const centerLabelText = svg.append("text")
                .attr("class", "center-label-modern")
                .attr("dy", "1.6em")
                .style("font-size", `${Math.max(10, outerRadius * 0.095)}px`)
                .text("TOTAL");

            // background subtle ring accent for depth (inner glow)
            svg.append("circle")
                .attr("r", innerRadius - 4)
                .attr("fill", "rgba(0, 15, 30, 0.4)")
                .attr("stroke", "rgba(0, 200, 255, 0.15)")
                .attr("stroke-width", 1.2)
                .style("pointer-events", "none");

            // interactive handlers
            paths.each(function(d, idx) {
                d3.select(this)
                    .on("mouseover", function(event, segmentArc) {
                        const percentage = ((segmentArc.data.val / total) * 100).toFixed(1);
                        const valFormatted = formatNumber(segmentArc.data.val);
                        tooltipEl.html(`
                            <b>${escapeHtml(segmentArc.data.lab)}</b><br/>
                            ${valFormatted}  <span style="opacity:0.7; font-size:11px;">(${percentage}%)</span>
                        `);
                        tooltipEl.style("opacity", 1).style("transform", "scale(1)");
                        // Update center preview to slice value
                        centerValText.text(formatNumber(segmentArc.data.val));
                        centerLabelText.text(segmentArc.data.lab.length > 20 ? segmentArc.data.lab.slice(0,18)+"…" : segmentArc.data.lab);
                        // subtle highlight on path
                        d3.select(this).attr("stroke", "#ffffff").attr("stroke-width", "3.2");
                    })
                    .on("mousemove", function(event) {
                        const x = event.clientX + 18;
                        const y = event.clientY - 32;
                        tooltipEl.style("left", `${x}px`).style("top", `${y}px`);
                    })
                    .on("mouseout", function() {
                        tooltipEl.style("opacity", 0);
                        centerValText.text(formatNumber(total));
                        centerLabelText.text("TOTAL");
                        d3.select(this).attr("stroke", "rgba(8, 14, 24, 0.8)").attr("stroke-width", "2.5");
                    });
            });

            // optional small decorative arcs: add subtle outer glow effect via filters
            svg.append("circle")
                .attr("r", outerRadius + 3)
                .attr("fill", "none")
                .attr("stroke", "rgba(0, 230, 250, 0.2)")
                .attr("stroke-width", 1)
                .style("pointer-events", "none");
        }

        function formatNumber(num) {
            if (num === undefined || num === null) return "0";
            if (num >= 1e6) return (num / 1e6).toFixed(1) + "M";
            if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
            return num.toLocaleString();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // leader: orchestrate data and render
        async function loadAndRender() {
            if (!worksheet) return;
            try {
                const [data, encodings] = await Promise.all([
                    getSummaryDataTable(worksheet),
                    getEncodingMap(worksheet)
                ]);
                renderDonut(data, encodings);
            } catch (err) {
                console.error("Render failed:", err);
                d3.select("#viz-container").append("div")
                    .attr("class", "state-message")
                    .style("position", "absolute")
                    .style("top", "50%")
                    .style("left", "50%")
                    .style("transform", "translate(-50%, -50%)")
                    .html("⚠️ Extension error: check data fields or console.");
            }
        }

        // debounced resize handler for high performance
        let resizeTimer;
        function handleResize() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (worksheet) loadAndRender();
            }, 120);
        }

        // Initialize Tableau Extension
        async function initExtension() {
            try {
                await tableau.extensions.initializeAsync();
                worksheet = tableau.extensions.worksheetContent.worksheet;
                if (!worksheet) {
                    d3.select("#viz-container").html('<div class="state-message" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">⚠️ No active worksheet found.</div>');
                    return;
                }
                await loadAndRender();
                // add event listeners for data changes and selection updates
                worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, () => loadAndRender());
                // also listen to selection changes? optional graceful
                worksheet.addEventListener(tableau.TableauEventType.SelectionChanged, () => loadAndRender());
                window.addEventListener('resize', handleResize);
            } catch (err) {
                console.error("init failed:", err);
                d3.select("#viz-container").html('<div class="state-message" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">💡 Extension init error. Check console.</div>');
            }
        }

        // additional minor cleanup for tooltip positioning and global style
        window.addEventListener('load', () => {
            initExtension();
        });
    })();
</script>
</body>
</html>
