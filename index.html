<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Hexbin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3"></script>
    <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #061222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; overflow: hidden; height: 100vh;
        }
        #app { padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        .header { margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: #fff; }
        .subtitle { opacity: .6; font-size: 14px; }
        .kpiRow { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi {
            flex: 1; background: linear-gradient(145deg, #102746, #0b1830);
            border-radius: 15px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,.3);
            position: relative; overflow: hidden;
        }
        .kpiLabel { opacity: .7; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .kpiValue { font-size: 28px; font-weight: bold; }
        .main { flex: 1; display: flex; gap: 20px; min-height: 0; }
        #hexMap {
            flex: 3; background: #0c1d35; border-radius: 15px;
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .sidePanel { flex: 1; background: #0c1d35; border-radius: 15px; padding: 20px; overflow-y: auto; }
        .panelTitle { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #4dabf7; }
        .rankItem {
            background: #102746; border-radius: 10px; padding: 12px; margin-bottom: 10px;
            transition: .2s; border: 1px solid rgba(255,255,255,0.05);
        }
        .rankState { font-size: 14px; font-weight: 700; }
        .rankProfit { opacity: .7; font-size: 12px; margin-top: 4px; }
        .tooltip {
            position: absolute; background: rgba(9, 17, 29, 0.95);
            border: 1px solid rgba(255,255,255,0.2); padding: 10px;
            border-radius: 8px; pointer-events: none; opacity: 0;
            font-size: 12px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .error-msg { padding: 40px; text-align: center; color: #ff6b6b; font-size: 18px; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="title">HEXBIN PERFORMANCE DASHBOARD</div>
        <div class="subtitle">Tableau Viz Extension • Data Pulse</div>
    </div>

    <div class="kpiRow">
        <div class="kpi">
            <div class="kpiLabel">Total Sales</div>
            <div class="kpiValue" id="salesKpi">$0</div>
        </div>
        <div class="kpi">
            <div class="kpiLabel">Total Profit</div>
            <div class="kpiValue" id="profitKpi">$0</div>
        </div>
        <div class="kpi">
            <div class="kpiLabel">Best Performing State</div>
            <div class="kpiValue" id="bestState">-</div>
        </div>
    </div>

    <div class="main">
        <div id="hexMap">
            <div class="tooltip" id="tooltip"></div>
        </div>
        <div class="sidePanel">
            <div class="panelTitle">TOP PROFIT STATES</div>
            <div id="ranking"></div>
        </div>
    </div>
</div>

<script>
let worksheet;

window.onload = async () => {
    try {
        await tableau.extensions.initializeAsync();
        worksheet = tableau.extensions.worksheetContent.worksheet;

        // Listen for data changes
        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateDashboard);
        
        // Initial load
        updateDashboard();
    } catch (err) {
        console.error(err);
    }
};

async function updateDashboard() {
    const data = await getTableauData();
    if (data) {
        render(data);
    }
}

async function getTableauData() {
    try {
        const visualSpec = await worksheet.getVisualSpecificationAsync();
        const marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
        
        // Map encoding IDs to actual Field Names
        const encodingMap = {};
        marksCard.encodings.forEach(enc => {
            encodingMap[enc.id] = enc.field.name;
        });

        // Validate that required fields are present
        if (!encodingMap.state || !encodingMap.sales || !encodingMap.profit) {
            document.getElementById("hexMap").innerHTML = `
                <div class="error-msg">
                    <b>Configuration Required</b><br><br>
                    Please drag fields to:<br>
                    • State shelf<br>
                    • Sales shelf<br>
                    • Profit shelf
                </div>`;
            return null;
        }

        const dataReader = await worksheet.getSummaryDataReaderAsync();
        let rows = [];

        for (let p = 0; p < dataReader.pageCount; p++) {
            const page = await dataReader.getPageAsync(p);
            
            // Map the indices of the columns
            const stateIdx = page.columns.find(c => c.fieldName === encodingMap.state).index;
            const salesIdx = page.columns.find(c => c.fieldName === encodingMap.sales).index;
            const profitIdx = page.columns.find(c => c.fieldName === encodingMap.profit).index;

            const pageData = page.data.map(r => ({
                state: r[stateIdx].formattedValue,
                sales: +r[salesIdx].value,
                profit: +r[profitIdx].value
            }));
            rows = rows.concat(pageData);
        }

        await dataReader.releaseAsync();
        return rows;

    } catch (err) {
        console.error("Data Fetch Error:", err);
        return null;
    }
}

function render(data) {
    // 1. Update KPIs
    const totalSales = d3.sum(data, d => d.sales);
    const totalProfit = d3.sum(data, d => d.profit);
    const best = [...data].sort((a, b) => b.profit - a.profit)[0];

    document.getElementById("salesKpi").innerText = "$" + Math.round(totalSales).toLocaleString();
    document.getElementById("profitKpi").innerText = "$" + Math.round(totalProfit).toLocaleString();
    document.getElementById("bestState").innerText = best?.state || "-";

    // 2. Update Ranking
    const rankingContainer = document.getElementById("ranking");
    rankingContainer.innerHTML = "";
    [...data].sort((a, b) => b.profit - a.profit).slice(0, 8).forEach((d, i) => {
        rankingContainer.innerHTML += `
            <div class="rankItem">
                <div class="rankState">#${i+1} ${d.state}</div>
                <div class="rankProfit">Profit: $${Math.round(d.profit).toLocaleString()}</div>
            </div>`;
    });

    // 3. Render Hex Map
    renderHexMap(data);
}

function renderHexMap(data) {
    const container = document.getElementById("hexMap");
    const tooltip = document.getElementById("tooltip");
    
    // Clear old SVG but keep tooltip
    const oldSvg = container.querySelector("svg");
    if (oldSvg) oldSvg.remove();

    const width = container.clientWidth;
    const height = container.clientHeight;
    const svg = d3.select(container).append("svg")
        .attr("width", width)
        .attr("height", height);

    const maxSales = d3.max(data, d => d.sales) || 1;
    const cols = 8;
    const spacingX = 85;
    const spacingY = 75;

    const group = svg.append("g").attr("transform", "translate(50, 50)");

    data.forEach((d, i) => {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const x = col * spacingX + (row % 2 === 0 ? 0 : spacingX / 2);
        const y = row * spacingY;
        
        const radius = 25 + (d.sales / maxSales) * 20;
        const color = d.profit >= 0 ? "#22c55e" : "#ef4444";

        const hex = group.append("g")
            .attr("class", "hex-group")
            .style("cursor", "pointer");

        hex.append("polygon")
            .attr("points", getHexPoints(x, y, radius))
            .attr("fill", color)
            .attr("stroke", "#061222")
            .attr("stroke-width", 2)
            .attr("opacity", 0.8)
            .on("mouseover", (event) => {
                gsap.to(event.currentTarget, { opacity: 1, duration: 0.2 });
                tooltip.style.opacity = 1;
                tooltip.innerHTML = `<b>${d.state}</b><br>Sales: $${Math.round(d.sales).toLocaleString()}<br>Profit: $${Math.round(d.profit).toLocaleString()}`;
            })
            .on("mousemove", (event) => {
                tooltip.style.left = (event.offsetX + 15) + "px";
                tooltip.style.top = (event.offsetY + 15) + "px";
            })
            .on("mouseout", (event) => {
                gsap.to(event.currentTarget, { opacity: 0.8, duration: 0.2 });
                tooltip.style.opacity = 0;
            });

        hex.append("text")
            .attr("x", x)
            .attr("y", y + 5)
            .attr("text-anchor", "middle")
            .attr("fill", "white")
            .attr("font-size", "10px")
            .attr("font-weight", "bold")
            .attr("pointer-events", "none")
            .text(d.state.substring(0, 2).toUpperCase());
    });

    gsap.from(".hex-group", {
        scale: 0, 
        opacity: 0, 
        duration: 0.5, 
        stagger: 0.01, 
        ease: "back.out(1.7)",
        transformOrigin: "center center"
    });
}

function getHexPoints(cx, cy, r) {
    let points = [];
    for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - (Math.PI / 6);
        points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
    }
    return points.join(" ");
}
</script>
</body>
</html>
