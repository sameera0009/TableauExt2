<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <title>Hexbin Viz Extension</title>

  <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 text-white m-0">

  <div class="p-4">

    <h1 class="text-2xl font-bold mb-4">
      Hexbin US Map
    </h1>

    <div
      id="chart"
      class="w-full h-[700px] bg-gray-900 rounded-2xl">
    </div>

  </div>

  <script>

    let worksheet;

    async function init() {

      await tableau.extensions.initializeAsync();

      worksheet =
        tableau.extensions.worksheetContent.worksheet;

      console.log("Worksheet:", worksheet.name);

      loadData();

      worksheet.addEventListener(
        tableau.TableauEventType.SummaryDataChanged,
        loadData
      );
    }

    async function getEncodingMap() {

      const visualSpec =
        await worksheet.getVisualSpecificationAsync();

      const marksCard =
        visualSpec.marksSpecifications[
          visualSpec.activeMarksSpecificationIndex
        ];

      const encodingMap = {};

      for (const encoding of marksCard.encodings) {

        if (encoding.fields.length > 0) {

          encodingMap[encoding.id] =
            encoding.fields[0].field.name;
        }
      }

      return encodingMap;
    }

    async function loadData() {

      const encodingMap =
        await getEncodingMap();

      console.log(encodingMap);

      const dataTable =
        await worksheet.getSummaryDataAsync();

      const columns =
        dataTable.columns.map(c => c.fieldName);

      const rows =
        dataTable.data;

      const chartData = [];

      rows.forEach(row => {

        const rowObj = {};

        columns.forEach((col, i) => {

          rowObj[col] = row[i].value;
        });

        chartData.push(rowObj);
      });

      renderChart(
        chartData,
        encodingMap
      );
    }

    function renderChart(data, encodingMap) {

      const chart =
        echarts.init(
          document.getElementById("chart")
        );

      const states = [

        { state: "California", x: 100, y: 120 },
        { state: "Texas", x: 250, y: 250 },
        { state: "Florida", x: 420, y: 300 },
        { state: "New York", x: 500, y: 100 }

      ];

      const merged = states.map(s => {

        const d =
          data.find(
            x =>
              x[encodingMap.state] === s.state
          );

        return {

          ...s,

          sales:
            d?.[encodingMap.sales] || 0,

          profit:
            d?.[encodingMap.profit] || 0
        };
      });

      const option = {

        backgroundColor: "#111827",

        tooltip: {

          formatter: (params) => {

            const d = params.data;

            return `
              <b>${d.state}</b><br/>
              Sales: ${d.sales}<br/>
              Profit: ${d.profit}
            `;
          }
        },

        xAxis: {
          show: false,
          min: 0,
          max: 700
        },

        yAxis: {
          show: false,
          min: 0,
          max: 500
        },

        series: [

          {

            type: "scatter",

            symbol: "hexagon",

            data: merged.map(d => ({

              value: [d.x, d.y],

              state: d.state,

              sales: d.sales,

              profit: d.profit,

              symbolSize:
                Math.sqrt(d.sales) / 8,

              itemStyle: {

                color:

                  d.profit > 0
                    ? "#22c55e"
                    : "#ef4444"
              }

            }))
          }
        ]
      };

      chart.setOption(option);

      gsap.from("#chart", {

        duration: 1,

        opacity: 0,

        y: 30
      });
    }

    init();

  </script>

</body>
</html>
